<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>달빛 정원 디펜스</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101a2b;color:#fff;font-family:system-ui,-apple-system,sans-serif}body{display:flex;align-items:center;justify-content:center}#game{position:relative;width:min(100vw,1100px);height:min(100dvh,760px);min-height:420px;overflow:hidden;background:#17263a;box-shadow:0 12px 60px #0009}canvas{display:block;width:100%;height:100%;image-rendering:pixelated;touch-action:manipulation}#top{position:absolute;left:12px;right:12px;top:10px;display:flex;gap:8px;align-items:flex-start;justify-content:space-between;pointer-events:none}.pill{background:#172238ed;border:2px solid #7188a4;border-radius:10px;padding:7px 11px;box-shadow:0 3px 0 #0a1220;font-size:clamp(11px,2.5vw,14px);font-weight:800;text-shadow:1px 2px #0008}#brand{font-size:clamp(13px,3vw,18px);color:#ffdf9a}#actions{position:absolute;right:12px;top:58px;display:flex;gap:6px}button{border:2px solid #8ba6bd;border-radius:9px;background:linear-gradient(#405c77,#26394f);color:white;font-weight:800;padding:8px 12px;box-shadow:0 3px 0 #101a2b;cursor:pointer}button:active{transform:translateY(2px);box-shadow:0 1px 0 #101a2b}#bottom{position:absolute;left:10px;right:10px;bottom:10px;display:flex;align-items:end;justify-content:space-between;pointer-events:none}#hint{max-width:65%;background:#172238dd;border:1px solid #758ba5;border-radius:9px;padding:7px 10px;font-size:clamp(10px,2.3vw,13px);line-height:1.35}#shop{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92%,540px);background:#17263af5;border:3px solid #adc0d1;border-radius:14px;padding:14px;box-shadow:0 12px 40px #000b;display:none;z-index:5}#shop h2{font-size:18px;margin:0 0 5px;color:#ffdf9a}#shop p{font-size:12px;color:#c9d6e4;margin:0 0 10px}#choices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.pick{min-width:0;padding:10px 5px 9px;border-color:#9db4ca;background:linear-gradient(#415e78,#293e56);font-size:12px;line-height:1.4}.pick b{display:block;font-size:14px;color:#fff0bc;margin-bottom:4px}#close{width:100%;margin-top:10px;background:#543e57;border-color:#bd9abf}#toast{position:absolute;left:50%;top:25%;transform:translateX(-50%);background:#111d2bef;border:2px solid #f6d997;border-radius:10px;padding:8px 14px;font-weight:800;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#0c1626b8;z-index:8}#panel{width:min(88%,440px);text-align:center;padding:22px;background:linear-gradient(150deg,#314b64,#192b40);border:3px solid #a8c2d6;border-radius:18px;box-shadow:0 12px 40px #0009}#panel h1{margin:0 0 8px;color:#ffe1a0;font-size:clamp(24px,6vw,34px);text-shadow:2px 3px #573b4b}#panel p{font-size:13px;line-height:1.6;color:#e1eaf1;margin:8px 0 16px}#start{font-size:17px;padding:12px 28px;background:linear-gradient(#e5ae65,#a9654b);border-color:#ffdda1;color:#241b24}@media(max-width:560px){#game{height:100dvh;min-height:0}#top{left:7px;right:7px;top:7px}.pill{padding:6px 8px}#actions{top:53px;right:7px}button{padding:7px 9px;font-size:11px}#bottom{left:7px;right:7px;bottom:7px}#hint{max-width:72%}#choices{gap:5px}.pick{font-size:10px;padding:9px 3px}.pick b{font-size:12px}}
</style></head><body><div id="game"><canvas id="c" width="960" height="600"></canvas><div id="top"><div class="pill"><div id="brand">✦ 달빛 정원 디펜스</div><div id="stats">❤️ 10　🪙 180　웨이브 0</div></div><div class="pill" id="score">처치 0</div></div><div id="actions"><button id="wave">웨이브 시작 ▶</button><button id="speed">1배속</button></div><div id="bottom"><div id="hint">빈 발판을 눌러 영웅을 배치해 보세요. 영웅마다 공격 방식이 달라요!</div></div><div id="shop"><h2>영웅 배치</h2><p>발판에 어울리는 수호자를 선택하세요.</p><div id="choices"><button class="pick" data-type="archer"><b>🏹 루나</b>비용 70<br>빠른 단일 공격</button><button class="pick" data-type="mage"><b>🔮 세라</b>비용 100<br>강한 마법 공격</button><button class="pick" data-type="healer"><b>🌸 미엘</b>비용 90<br>주변 영웅 지원</button></div><button id="close">닫기</button></div><div id="toast"></div><div id="overlay"><div id="panel"><h1>달빛 정원 디펜스</h1><p>마법 정원을 지키는 소녀 영웅들을 배치하세요.<br>길을 따라 몰려오는 귀여운 마물들을 막아내세요!<br><br>빈 발판 터치 → 영웅 선택 → 웨이브 시작</p><button id="start">정원 지키기!</button></div></div></div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');if(!ctx){document.getElementById('panel').innerHTML='<h1>화면을 시작할 수 없어요</h1><p>브라우저를 새로고침해 주세요.</p>';return}ctx.imageSmoothingEnabled=false;
const W=960,H=600,stats=document.getElementById('stats'),scoreEl=document.getElementById('score'),shop=document.getElementById('shop'),toastEl=document.getElementById('toast'),overlay=document.getElementById('overlay');let gold=180,lives=10,waveNo=0,kills=0,started=false,running=false,speed=1,selectedPad=-1,enemies=[],heroes=[],shots=[],particles=[],spawnLeft=0,spawnTimer=0,toastTimer=0,last=0;
const pads=[{x:230,y:190},{x:390,y:145},{x:585,y:170},{x:760,y:245},{x:205,y:410},{x:430,y:420},{x:650,y:405},{x:800,y:430}],path=[{x:-50,y:310},{x:100,y:310},{x:190,y:350},{x:320,y:350},{x:410,y:300},{x:535,y:300},{x:625,y:350},{x:760,y:350},{x:860,y:300},{x:1010,y:300}];
const types={archer:{name:'루나',cost:70,range:190,rate:.72,damage:22,color:'#79d8e8',hair:'#80c9ec',dress:'#4c84ad',projectile:'#b5f5ff'},mage:{name:'세라',cost:100,range:215,rate:1.35,damage:48,color:'#c69aff',hair:'#b98be5',dress:'#7653a5',projectile:'#e1b5ff'},healer:{name:'미엘',cost:90,range:150,rate:1.1,damage:13,color:'#ff9dbc',hair:'#f2b4cf',dress:'#d66f9b',projectile:'#ffc2dc'}};
const monsters=[{hair:'#a9d889',dress:'#628a75',skin:'#f5d2c0',horn:'#e5f0c3'},{hair:'#e99aa9',dress:'#984e77',skin:'#f5c3b3',horn:'#f4c4a4'},{hair:'#b59be8',dress:'#654e91',skin:'#efc0bc',horn:'#dd9ed8'}];
function poly(a,fill,stroke,line=2){ctx.beginPath();a.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=line;ctx.stroke()}}
function line(a,color,width){ctx.beginPath();a.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke()}
function rr(x,y,w,h,r,fill,stroke){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke()}}
function background(t){let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#243e55');g.addColorStop(.55,'#47745f');g.addColorStop(1,'#254b45');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);poly([{x:0,y:250},{x:130,y:140},{x:270,y:235},{x:420,y:120},{x:590,y:235},{x:770,y:145},{x:960,y:250},{x:960,y:390},{x:0,y:390}],'#355c63');for(let i=0;i<22;i++){let x=(i*137)%980,y=100+(i*73)%180;ctx.globalAlpha=.23;ctx.fillStyle=i%2?'#d4e4ad':'#829f8b';ctx.fillRect(x,y,3,3);ctx.fillRect(x+5,y+4,2,2)}ctx.globalAlpha=1;for(let y=270;y<600;y+=42)for(let x=-50;x<1020;x+=76){let xx=x+((Math.floor(y/42)%2)*38);poly([{x:xx,y},{x:xx+38,y:y-12},{x:xx+76,y},{x:xx+38,y:y+12}],((Math.floor(x/76)+Math.floor(y/42))%2)?'#477b62':'#4c8264','#699579',1)}for(let i=0;i<18;i++){let x=(i*173+35)%960,y=245+(i*67)%320;if(y>280){ctx.fillStyle='#274b42';ctx.fillRect(x-5,y-20,10,24);ctx.fillStyle=i%2?'#78a66f':'#94b879';ctx.fillRect(x-18,y-43,36,28);ctx.fillStyle='#b7d18c';ctx.fillRect(x-10,y-48,12,7)}}line(path,'#6b594d',48);line(path,'#b69a76',38);line(path,'#d5bd91',27);for(let d=0;d<28;d++){ctx.fillStyle='#e5d0a6';ctx.globalAlpha=.25;ctx.fillRect(35+d*34,310+Math.sin(d*.53)*23,7,3)}ctx.globalAlpha=1;poly([{x:858,y:240},{x:920,y:200},{x:970,y:240},{x:970,y:330},{x:858,y:330}],'#9bb7c4','#d5e3df',3);poly([{x:858,y:240},{x:920,y:200},{x:970,y:240},{x:920,y:278}],'#d5e1d9','#f4e7bb',2);rr(895,274,42,56,5,'#4b6274','#d3d8cc');rr(907,292,17,38,3,'#233b4f');for(let i=0;i<3;i++){ctx.fillStyle='#e3c58a';ctx.fillRect(870+i*36,222,18,22);ctx.fillStyle='#526c7e';ctx.fillRect(875+i*36,227,8,13)}ctx.fillStyle='#fff0bc';ctx.beginPath();ctx.arc(820,85,26,0,Math.PI*2);ctx.fill();ctx.fillStyle='#243e55';ctx.beginPath();ctx.arc(832,76,24,0,Math.PI*2);ctx.fill();for(let i=0;i<35;i++){let x=(i*83+31)%950,y=(i*47+20)%190;ctx.fillStyle='#fff1c3';ctx.globalAlpha=.35+.35*Math.sin(t*1.2+i);ctx.fillRect(x,y,3,3)}ctx.globalAlpha=1}
function drawPad(p,i){let used=heroes.some(h=>h.pad===i);poly([{x:p.x,y:p.y-14},{x:p.x+30,y:p.y},{x:p.x,y:p.y+14},{x:p.x-30,y:p.y}],used?'#7a9c9b':'#b9c6a0','#e6e3c2',2);poly([{x:p.x,y:p.y-9},{x:p.x+20,y:p.y},{x:p.x,y:p.y+9},{x:p.x-20,y:p.y}],used?'#557e83':'#829c70','#d9ddb4',1);if(!used){ctx.fillStyle='#fff0bd';ctx.font='bold 18px sans-serif';ctx.textAlign='center';ctx.fillText('+',p.x,p.y+6)}}
function pixelChar(x,y,kind,v,anim,attack=0){let cfg=kind==='hero'?Object.values(types)[v%3]:monsters[v%3],bob=Math.sin(anim*7)*.9,walk=Math.sin(anim*13);ctx.fillStyle='#142a2a66';ctx.beginPath();ctx.ellipse(x,y-2,25,8,0,0,Math.PI*2);ctx.fill();ctx.save();ctx.translate(Math.round(x-27),Math.round(y-72+bob));ctx.scale(2.25,2.25);const px=(xx,yy,w,h,c)=>{ctx.fillStyle=c;ctx.fillRect(xx,yy,w,h)};px(6,7,12,12,cfg.hair);px(4,11,4,12,cfg.hair);px(16,10,4,14,cfg.hair);if(kind==='monster'){px(5,3,3,5,cfg.horn);px(16,3,3,5,cfg.horn);px(3,9,3,3,'#f3b6bd');px(18,9,3,3,'#f3b6bd')}px(8,25+(walk>0?1:0),3,5,'#f0d1c3');px(13,25+(walk<0?1:0),3,5,'#f0d1c3');px(7,29,5,2,kind==='hero'?'#f2d7e0':'#7a557f');px(13,29,5,2,kind==='hero'?'#f2d7e0':'#7a557f');px(7,17,10,9,cfg.dress);px(5,19,14,3,cfg.color||cfg.horn);px(8,17,8,2,'#f9dfb7');let arm=attack>0?Math.round(attack*3):Math.round(walk);px(4,18+arm,3,7,'#f2cbbd');px(17,18-arm,3,7,'#f2cbbd');px(7,8,10,9,'#f4d2c0');px(6,10,2,4,'#e9b6ad');px(17,10,2,4,'#e9b6ad');px(6,5,12,5,cfg.hair);px(5,7,4,5,cfg.hair);px(14,7,5,3,cfg.hair);px(8,12,2,2,'#49394a');px(14,12,2,2,'#49394a');let blink=Math.sin(anim*2.2)>.985;if(!blink){px(8,12,2,1,'#fff');px(14,12,2,1,'#fff')}px(11,15,2,1,'#c87983');px(9,16,6,1,'#ed9da8');if(kind==='hero'){px(16,6,3,3,v===0?'#f5e49d':v===1?'#d4b4ff':'#fff0b5');px(18,5,2,2,'#fff6d1');if(v===0){px(20,17,2,9,'#d8e9e5');px(19,15,4,3,'#9cdae7')}if(v===1){px(20,15,3,3,'#e6c0ff');px(21,12,1,3,'#f8e6ff')}if(v===2){px(20,17,2,5,'#ffcadb');px(19,15,4,2,'#fff0bd')}}else{px(8,3,8,2,cfg.horn);px(3,16,3,5,cfg.hair);px(20,17,2,8,'#e8b1bb')}ctx.restore()}
function drawEnemy(e,t){pixelChar(e.x,e.y,'monster',e.variant,t+e.seed);rr(e.x-19,e.y-83,38,6,2,'#382d3a','#d7d3c0');rr(e.x-18,e.y-82,36*Math.max(0,e.hp/e.maxHp),4,1,'#f18a9e')}
function drawHero(h,t){let cfg=types[h.type],pulse=Math.max(0,1-h.attackT/.18);ctx.globalAlpha=.3+Math.sin(t*3+h.pad)*.1;ctx.fillStyle=cfg.color;ctx.beginPath();ctx.ellipse(h.x,h.y+2,30,10,0,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;pixelChar(h.x,h.y,'hero',h.variant,t+h.anim,pulse)}
function particlesAt(x,y,color,n=7){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*100,vy:(Math.random()-.7)*100,life:.45,max:.45,color})}
function pathPos(progress){let lengths=[],total=0;for(let i=0;i<path.length-1;i++){let a=path[i],b=path[i+1],d=Math.hypot(b.x-a.x,b.y-a.y);lengths.push(d);total+=d}let dist=progress*total;for(let i=0;i<lengths.length;i++){if(dist<=lengths[i]){let a=path[i],b=path[i+1],q=dist/lengths[i];return{x:a.x+(b.x-a.x)*q,y:a.y+(b.y-a.y)*q}}dist-=lengths[i]}return path[path.length-1]}
function spawnEnemy(){let v=(waveNo+spawnLeft)%3,base=70+waveNo*18;enemies.push({progress:0,x:path[0].x,y:path[0].y,hp:base,maxHp:base,speed:48+waveNo*2,variant:v,seed:Math.random()*9,slow:0});spawnLeft--;spawnTimer=.8}
function toast(s){toastEl.textContent=s;toastEl.style.opacity=1;toastTimer=1.65}function hud(){stats.textContent=`❤️ ${lives}　🪙 ${gold}　웨이브 ${waveNo}`;scoreEl.textContent=`처치 ${kills}`;document.getElementById('wave').textContent=running?'전투 중…':'웨이브 시작 ▶'}
function startWave(){if(running||!started||lives<=0)return;waveNo++;spawnLeft=5+waveNo*2;spawnTimer=.2;running=true;toast(`${waveNo} 웨이브 출현!`);hud()}
function placeHero(type){if(selectedPad<0)return;let cfg=types[type];if(gold<cfg.cost){toast('골드가 부족해요!');return}if(heroes.some(h=>h.pad===selectedPad)){toast('이미 영웅이 배치되어 있어요.');return}gold-=cfg.cost;let p=pads[selectedPad];heroes.push({pad:selectedPad,x:p.x,y:p.y,type,variant:Object.keys(types).indexOf(type),cool:.3,attackT:0,anim:Math.random()*5});shop.style.display='none';selectedPad=-1;toast(`${cfg.name} 배치 완료!`);hud()}
function update(dt,t){if(running){if(spawnLeft>0){spawnTimer-=dt;if(spawnTimer<=0)spawnEnemy()}enemies.forEach(e=>{e.progress+=e.speed*dt/1050*(e.slow>0?.55:1);if(e.slow>0)e.slow-=dt;let p=pathPos(e.progress);e.x=p.x;e.y=p.y});heroes.forEach(h=>{h.anim+=dt;h.cool-=dt;if(h.attackT>0)h.attackT-=dt;let cfg=types[h.type];if(h.cool<=0){let target=null,dist=cfg.range;enemies.forEach(e=>{let d=Math.hypot(e.x-h.x,e.y-h.y);if(d<dist&&e.progress<.99){target=e;dist=d}});if(target){target.hp-=cfg.damage;h.attackT=.18;h.cool=cfg.rate;shots.push({x:h.x+15,y:h.y-48,target,color:cfg.projectile,life:.24});if(h.type==='mage')target.slow=.65;if(target.hp<=0){gold+=13+Math.floor(waveNo/2);kills++;particlesAt(target.x,target.y-35,cfg.projectile,10)}}}});enemies=enemies.filter(e=>{if(e.hp<=0)return false;if(e.progress>=1){lives--;particlesAt(e.x,e.y-30,'#ff8c9c',10);if(lives<=0){lives=0;running=false;toast('정원이 무너졌어요! 새로고침해 다시 도전하세요.')}return false}return true});if(spawnLeft===0&&enemies.length===0&&running){running=false;let bonus=35+waveNo*3;gold+=bonus;toast('웨이브 방어 성공! 보너스 골드 +'+bonus)}}shots.forEach(s=>s.life-=dt);shots=shots.filter(s=>s.life>0);particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=90*dt;p.life-=dt});particles=particles.filter(p=>p.life>0);if(toastTimer>0){toastTimer-=dt;if(toastTimer<=0)toastEl.style.opacity=0}hud()}
function draw(t){background(t);pads.forEach(drawPad);for(let i=0;i<8;i++){let p=pathPos((i+1)/9);ctx.fillStyle='#ffe5a0';ctx.globalAlpha=.7;ctx.fillRect(p.x-2,p.y-22,4,4)}ctx.globalAlpha=1;heroes.slice().sort((a,b)=>a.y-b.y).forEach(h=>drawHero(h,t));enemies.slice().sort((a,b)=>a.y-b.y).forEach(e=>drawEnemy(e,t));shots.forEach(s=>{if(!s.target)return;let q=Math.min(1,1-s.life/.24),x=s.x+(s.target.x-s.x)*q,y=s.y+(s.target.y-40-s.y)*q;ctx.fillStyle=s.color;ctx.shadowColor=s.color;ctx.shadowBlur=10;ctx.fillRect(x-4,y-4,8,8);ctx.shadowBlur=0});particles.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,4,4)});ctx.globalAlpha=1;if(selectedPad>=0){let p=pads[selectedPad];ctx.strokeStyle='#fff1a6';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(p.x,p.y,36,18,0,0,Math.PI*2);ctx.stroke()}}
function loop(now){let dt=Math.min(.04,(now-last)/1000||0);last=now;if(started)update(dt*speed,now/1000);draw(now/1000);requestAnimationFrame(loop)}
function canvasPoint(ev){let r=canvas.getBoundingClientRect();return{x:(ev.clientX-r.left)*W/r.width,y:(ev.clientY-r.top)*H/r.height}}
canvas.addEventListener('pointerdown',ev=>{if(!started||shop.style.display==='block')return;let p=canvasPoint(ev),nearest=-1,dist=40;pads.forEach((pad,i)=>{let d=Math.hypot(p.x-pad.x,(p.y-pad.y)*1.5);if(d<dist){dist=d;nearest=i}});if(nearest>=0){let existing=heroes.find(h=>h.pad===nearest);if(existing){toast(`${types[existing.type].name} · 사거리 ${types[existing.type].range}`);return}selectedPad=nearest;shop.style.display='block'}});
document.querySelectorAll('.pick').forEach(b=>b.addEventListener('click',()=>placeHero(b.dataset.type)));document.getElementById('close').onclick=()=>{shop.style.display='none';selectedPad=-1};document.getElementById('wave').onclick=startWave;document.getElementById('speed').onclick=()=>{speed=speed===1?2:1;document.getElementById('speed').textContent=speed+'배속'};document.getElementById('start').onclick=()=>{overlay.style.display='none';started=true;toast('영웅을 배치한 뒤 웨이브를 시작하세요!')};window.addEventListener('keydown',e=>{if(e.key==='Escape'){shop.style.display='none';selectedPad=-1}});requestAnimationFrame(loop);
})();
</script></body></html>
